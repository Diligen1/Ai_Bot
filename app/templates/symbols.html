{% extends "base.html" %}

{% block content %}
<section class="card single-card">
    <div class="card-title">SYMBOL WHITELIST</div>
    <form method="post" class="form-row">
        <input type="text" name="symbol" placeholder="Enter symbol e.g. BTCUSDT" required />
        <button type="submit" name="action" value="add">Add Symbol</button>
    </form>
    {% if whitelist_symbols %}
        <div class="table-wrap">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Symbol</th>
                        <th>Added</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for symbol in whitelist_symbols %}
                        <tr>
                            <td>{{ symbol.symbol }}</td>
                            <td>{{ symbol.created_at or '-' }}</td>
                            <td>
                                <form method="post" style="display:inline; margin:0;">
                                    <input type="hidden" name="symbol" value="{{ symbol.symbol }}" />
                                    <button type="submit" name="action" value="remove">Remove</button>
                                </form>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    {% else %}
        <div class="card-text">No whitelisted symbols configured yet.</div>
    {% endif %}
</section>
{% endblock %}
